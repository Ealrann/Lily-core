buildscript {
	repositories {
		mavenLocal()
		mavenCentral()
	}
}

plugins {
	id 'base'
}

subprojects {
	apply plugin: 'java-library'

	group = "org.sheepy.lily.core"
	version = "1.3.0"

	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	repositories {
		mavenLocal()
		mavenCentral()
	}

	afterEvaluate {
		repositories {
			mavenLocal()
			mavenCentral()
		}
	}

	tasks.register("buildAll") {
		group = "build"
		description = "Builds all Lily-core subprojects"
		dependsOn(subprojects.collect { it.tasks.named("build") })
	}

	tasks.named("build") {
		dependsOn("buildAll")
	}
}
